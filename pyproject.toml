[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-object-sorter"
version = "0.1.0"
description = "OpenCV color-object detection and serial sorter control"
requires-python = ">=3.10"
authors = [{name = "Vivek Vala"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
